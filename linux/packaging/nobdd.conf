# NOBD Desktop (Linux) — /etc/nobd/nobdd.conf
#
# Per-user overrides go in ~/.config/nobd/nobdd.conf and win over this file.
# `nobdd set window_ms 6` changes a running daemon live without editing anything.
# Every value below is the built-in default; lines are commented out so the file
# documents itself without changing behaviour.

# --- the sync window ------------------------------------------------------

# How long a lone attack press waits for its partner, in ms. 0..=16 (16 ms is
# one 60 Hz frame — the original hardware contract). 5 is the firmware default.
# Measure yours: play a set, then `nobdd stats` and look at gap_max_us.
#window_ms = 5

# Master switch. Off leaves the virtual pad in place, passing input straight
# through — the A/B test: play a set off, a set on.
#enabled = true

# Which buttons the window groups. A chord means 2+ of these held together.
# Names: a b x y lb rb ls rs start back up down left right
#attack_buttons = a,b,x,y,lb,rb

# Window the d-pad too. Firmware-exact, and NOT recommended for play: it delays
# motion inputs, so fast fly / triangle dashes lose their frame-tight timing.
#window_directions = false

# --- latency --------------------------------------------------------------

# Busy-poll the last N µs before a window closes, instead of sleeping until the
# timer. Costs one core only during those µs, and only while a window is open.
# 0 disables it (the timerfd alone is already deadline-exact to ~tens of µs).
#spin_us = 200

# Prefer the stick's NOBD Bulk stream (~10 kHz) over its HID reports when the
# firmware exposes it. Falls back to evdev automatically.
#prefer_bulk = true

# Force usbhid's joystick polling interval, in ms. 0 leaves the kernel alone;
# 1 pins every HID joystick bound from that point on to 1 kHz. The modprobe.d
# drop-in makes it survive reboots.
#jspoll_ms = 0

# --- real-time tuning -----------------------------------------------------
# `nobdd tune` reports which of these this machine actually allows.

# Drop the 50 µs default timer slack to 1 ns, so the window closes when it says.
#rt_timer_slack = true

# Hold /dev/cpu_dma_latency at 0 — no deep C-states, so the USB completion
# interrupt after an idle gap is not paying tens of µs of exit latency.
# Costs idle power. Turn it off on a battery-powered handheld if you care more
# about runtime than about the first press after a pause.
#rt_cpu_dma_latency = true

# SCHED_FIFO priority for the engine thread. Deliberately below the 50 that
# audio and irq threads use. Set to `off` to stay at normal priority.
#rt_sched_fifo = 20

# Lock our pages so a major fault can never land mid-window.
#rt_mlock = true

# Pin the engine to one CPU. Empty = let the scheduler decide.
#rt_cpu =

# --- devices --------------------------------------------------------------

# Exact stick to use — a /dev/input/eventN path or the device name from
# `nobdd list`. Empty = the first gamepad that is not our own virtual pad.
#device =

# Take exclusive ownership (EVIOCGRAB) so nothing else reads the raw stick.
# Leave this on: with it off, games see both the raw stick and the NOBD pad.
#grab = true

# How the virtual pad identifies itself.
#   xbox360 — byte-identical to a wired Xbox 360 pad. Zero-config: SDL, Steam
#             Input and Proton all apply their built-in mapping. The default.
#   nobd    — branded "NOBD Controller". Visible in listings, but it is a new
#             GUID, so it arrives unmapped until you configure a mapping.
#identity = xbox360

#control_socket = /run/nobd/nobdd.sock
