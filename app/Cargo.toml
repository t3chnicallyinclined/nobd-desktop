[package]
name = "nobd-app"
version = "0.7.0"
edition = "2021"
description = "NOBD desktop — finger-gap tester + sync-window control panel"

[[bin]]
name = "nobd"
path = "src/main.rs"

[dependencies]
# Self-updater. Same crate set the Retro Receipts agent has been self-updating with in
# the field: blocking HTTP (no async runtime in this app), minisign verification of the
# payload, and an atomic exe swap.
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
minisign-verify = "0.2"
self-replace = "1"
base64 = "0.22"

nobd-shared = { path = "../shared" }
hm-native = { path = "../hm-native" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
gilrs = "0.11"
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_XboxController",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Media",
    # Raw-HID input source: enumerate + open + read + decode HID gamepads.
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    # CreateToolhelp32Snapshot: check whether the game is running without
    # spawning tasklist on the UI thread.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
] }

[build-dependencies]
ico = "0.3"
winresource = "0.1"
